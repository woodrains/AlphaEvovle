# ============================================
# OpenEvolve Configuration for Soter Mapping Optimization
# Target: Optimize tensor-to-accelerator mappings via Timeloop
# ============================================

max_iterations: 50              # 演化迭代次数
checkpoint_interval: 10         # 检查点保存间隔
log_level: "INFO"

# ==================== LLM配置 ====================
llm:
  # GLM-4.6 作为主力模型
  primary_model: "glm-4.6"
  primary_model_weight: 1.0

  # API配置（OpenAI兼容格式）
  api_base: "https://open.bigmodel.cn/api/paas/v4/"
  api_key: "283fe07947104336948a068b2501e885.Jnb3Nou8WS0Fz7Yj"

  # 生成参数
  temperature: 0.7         # 平衡探索与利用
  top_p: 0.95
  max_tokens: 8000         # 映射优化不需要太长输出
  timeout: 600             # 10分钟（Timeloop评估可能慢）

# ==================== Prompt配置 ====================
prompt:
  # 提示模板目录（更新为新的项目结构）
  template_dir: "/root/evolve_1108/cc_1108/config/prompts"

  # Top程序数量（用于学习）
  num_top_programs: 3
  num_diverse_programs: 2        # 多样性启发程序数量

  # Artifacts配置
  include_artifacts: true
  max_artifact_bytes: 8192      # 限制Timeloop输出大小
  artifact_security_filter: true

# ==================== Database配置 ====================
database:
  db_path: "./outputs/evolution/eyeriss_mapping_evolution"
  population_size: 20          # 映射空间大，需要更多种群
  archive_size: 10
  num_islands: 3               # 岛屿模型维持多样性

  # 采样策略
  elite_selection_ratio: 0.3   # 从精英采样比例
  exploitation_ratio: 0.3      # 从archive采样（利用已知好解）
  exploration_ratio: 0.2       # 随机采样（探索未知区域）

# ==================== Evaluator配置 ====================
evaluator:
  timeout: 600                 # 单次Timeloop评估超时（秒）
  parallel_evaluations: 4      # 并行评估数量

# ==================== Evolution配置 ====================
# 进化策略配置
diff_based_evolution: true        # 使用diff-based修改（适合Python代码）
allow_full_rewrites: true         # 允许完全重写映射策略
max_code_length: 50000            # 映射程序不会太长

# 代码演化配置
language: "python"
evolve_blocks_only: true          # 只演化EVOLVE-BLOCK标记的代码
