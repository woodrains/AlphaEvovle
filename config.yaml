# ============================================
# OpenEvolve Configuration for Soter Mapping Optimization
# Target: Optimize tensor-to-accelerator mappings via Timeloop
# ============================================

max_iterations: 50              # 演化迭代次数
checkpoint_interval: 10         # 检查点保存间隔
log_level: "INFO"

# ==================== LLM配置 ====================
llm:
  # GLM-4.6 作为主力模型
  primary_model: "glm-4.6"
  primary_model_weight: 1.0

  # API配置（基于 /root/evolve_1108/docs/GLM_api.md）
  api_base: "https://open.bigmodel.cn/api/paas/v4/"
  api_key: "283fe07947104336948a068b2501e885.Jnb3Nou8WS0Fz7Yj"

  # 生成参数
  temperature: 0.7         # 平衡探索与利用（MLX用0.6，映射问题稍高）
  top_p: 0.95
  max_tokens: 8000         # 映射优化不需要太长输出
  timeout: 600             # 10分钟（Timeloop评估可能慢）

# ==================== Prompt配置 ====================
prompt:
  # 提示模板目录（相对于项目根目录）
  template_dir: "/root/evolve_1108/cc_1108/prompts"

  # Top程序数量（用于学习）
  num_top_programs: 3
  num_inspirations: 2

  # Artifacts配置
  include_artifacts: true
  max_artifact_bytes: 8192      # 限制Timeloop输出大小（增大以容纳详细信息）
  artifact_security_filter: true

  # 映射优化特定配置
  include_constraint_violations: true   # 包含约束违反详情
  include_timeloop_stats: true          # 包含Timeloop统计
  include_performance_comparison: true  # 包含与baseline的对比

# ==================== Database配置 ====================
database:
  db_path: "./openevolve_output/eyeriss_mapping_evolution"
  population_size: 20          # 映射空间大，需要更多种群
  archive_size: 10
  num_islands: 3               # 岛屿模型维持多样性

  # 特征维度（MAP-Elites）- 用于diversity，不是fitness
  feature_dimensions:
    - "latency"      # Timeloop返回的cycles（自动归一化）
    - "energy"       # Timeloop返回的energy（自动归一化）

  # 每个feature维度的bins数量
  feature_bins: 10

  # 采样策略（三层采样：exploration, exploitation, weighted）
  exploration_ratio: 0.2       # 随机采样（探索未知区域）
  exploitation_ratio: 0.3      # 从archive采样（利用已知好解）
  # 剩余0.5使用加权采样（weighted by fitness）

  # 岛屿迁移配置
  migration_interval: 50       # 每50代迁移一次
  migration_rate: 0.1          # 每次迁移10%的程序

  # Novelty检测配置
  similarity_threshold: 0.95   # 程序相似度阈值
  use_novelty_filter: true     # 启用novelty过滤

# ==================== Evaluator配置 ====================
evaluator:
  timeout: 600                 # 单次Timeloop评估超时（秒）
  parallel_evaluations: 4      # 并行评估数量

  # 分层评估配置（借鉴mlx_metal_kernel_opt的bulletproof策略）
  cascade_evaluation: true
  cascade_thresholds:
    - 0.0    # Stage1: 约束检查（通过即可，不需要分数门槛）
    - 0.0    # Stage2: Timeloop评估（只要完成评估即通过）

  # Timeloop配置
  timeloop_bin: "timeloop-model"  # 确保在PATH中
  architecture: "eyeriss"          # 目标加速器
  in_config_dir: "./in_config"

  # 约束检查配置
  use_constraint_checker: true
  constraint_checker_timeout: 5    # 快速约束检查（秒）

# ==================== Evolution配置 ====================
# 进化策略配置
diff_based_evolution: true        # 使用diff-based修改（适合Python代码）
allow_full_rewrites: true         # 允许完全重写映射策略
max_code_length: 50000            # 映射程序不会太长

# 代码演化配置
language: "python"
evolve_blocks_only: true          # 只演化EVOLVE-BLOCK标记的代码

# ==================== Soter特定配置 ====================
soter:
  architecture: "eyeriss"
  problem_file: "conv_layer_resnet50_layer1.yaml"

  # 映射参数范围（从Soter约束分析报告）
  max_buffer_levels: 4           # DRAM/Global/Dummy/PE
  dimension_order: ["N", "K", "C", "P", "Q", "R", "S"]
  num_primes: 5                  # 质因数分解维度

  # 优化目标
  fitness_objectives:
    - "edp"       # Energy-Delay Product（主要）
    - "latency"   # 延迟（次要）
    - "energy"    # 能耗（次要）
